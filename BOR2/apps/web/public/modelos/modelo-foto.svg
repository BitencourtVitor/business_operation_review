<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <!-- Foto de mentira: uma parede de madeira vista de perto, que é o que a
       maioria das fotos do punch é. Serve para julgar enquadramento e cor. -->
