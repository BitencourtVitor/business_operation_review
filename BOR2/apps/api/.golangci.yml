run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - godot
    - noctx
    - exhaustive

linters-settings:
  goimports:
    local-prefixes: github.com/bitencourtVitor/bor2-api

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck
