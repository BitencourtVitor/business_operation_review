name: Orchestrate Deploys

on:
  push:
    branches: [main]

jobs:
  paths-filter:
    runs-on: ubuntu-latest
    outputs:
      base-image: ${{ steps.filter.outputs.base-image }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            base-image:
              - 'BOR2/apps/web/Dockerfile.base'

  build-base-image:
    needs: paths-filter
    if: needs.paths-filter.outputs.base-image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: BOR2/apps/web
          file: BOR2/apps/web/Dockerfile.base
          push: true
          tags: ghcr.io/bitencourtvitor/bor-base:bun-1.3.11
