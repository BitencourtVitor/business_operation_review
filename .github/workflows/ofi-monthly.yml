name: OFI Monthly Calculator

on:
  # Railway owns the automatic monthly schedule. This workflow is an explicit
  # manual fallback only, with periods required to prevent an accidental close.
  workflow_dispatch:
    inputs:
      execution_month:
        description: Month to close (1-12)
        required: true
        type: number
      execution_year:
        description: Year to close
        required: true
        type: number
      planning_month:
        description: Month to plan (1-12)
        required: true
        type: number
      planning_year:
        description: Year to plan
        required: true
        type: number

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OFI calculate
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXECUTION_MONTH: ${{ inputs.execution_month }}
          EXECUTION_YEAR: ${{ inputs.execution_year }}
          PLANNING_MONTH: ${{ inputs.planning_month }}
          PLANNING_YEAR: ${{ inputs.planning_year }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL and CRON_SECRET secrets are required" >&2
            exit 1
          fi
          if ! [[ "$EXECUTION_MONTH" =~ ^([1-9]|1[0-2])$ ]] || \
             ! [[ "$PLANNING_MONTH" =~ ^([1-9]|1[0-2])$ ]]; then
            echo "Months must be between 1 and 12" >&2
            exit 1
          fi
          if ! [[ "$EXECUTION_YEAR" =~ ^[0-9]{4}$ ]] || \
             ! [[ "$PLANNING_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Years must use four digits" >&2
            exit 1
          fi
          API_URL="${API_URL%/}"
          STATUS=$(curl -s -o /tmp/ofi_resp.json -w "%{http_code}" \
            -X POST "$API_URL/api/v1/ofi/calculate" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d "{\"executionMonth\":$EXECUTION_MONTH,\"executionYear\":$EXECUTION_YEAR,\"month\":$PLANNING_MONTH,\"year\":$PLANNING_YEAR}")
          echo "HTTP status: $STATUS"
          cat /tmp/ofi_resp.json
          if [ "$STATUS" != "200" ]; then
            echo "OFI calculate failed with HTTP $STATUS" >&2
            exit 1
          fi
